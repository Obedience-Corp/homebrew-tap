name: Obey Voice bottles
run-name: Obey Voice ${{ inputs.mode || 'build' }} @ ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - Formula/obey-voice.rb
      - scripts/verify-obey-voice.py
      - .github/workflows/obey-voice-bottles.yml
      - packaging/obey-voice-release.json
  push:
    branches: [obey-voice-release]
    paths:
      - Formula/obey-voice.rb
      - scripts/verify-obey-voice.py
      - .github/workflows/obey-voice-bottles.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Build bottles, verify staged release bottles, or test public installation
        type: choice
        options: [build, verify, public]
        default: build
        required: true
      release_tag:
        description: Tap release tag for staged verification (obey-voice-vX.Y.Z)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged:
    # GitHub requires write access to read drafts. Isolate that token from all
    # repository code, formula execution and build jobs; this job only downloads.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download draft bottles without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^obey-voice-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir staged-bottles
          gh release download "$RELEASE_TAG" -R Obedience-Corp/homebrew-tap \
            --pattern '*.bottle.tar.gz' --dir staged-bottles
      - uses: actions/upload-artifact@v4
        with:
          name: staged-obey-voice-bottles
          path: staged-bottles/*.bottle.tar.gz
          if-no-files-found: error
          retention-days: 1
  bottles:
    needs: staged
    if: ${{ !cancelled() && (needs.staged.result == 'success' || needs.staged.result == 'skipped') }}
    name: Bottle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        with:
          stable: true
      - name: Install exact tap revision
        env:
          TAP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # setup-homebrew installs this tap and links it to GITHUB_WORKSPACE.
          # For PRs, replace its synthetic merge ref with the actual head commit.
          tap="$(brew --repository)/Library/Taps/obedience-corp/homebrew-tap"
          git -C "$tap" fetch origin "$TAP_REF"
          git -C "$tap" checkout --detach "$TAP_REF"
          test "$(git -C "$tap" rev-parse HEAD)" = "$TAP_REF"
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'verify'
        with:
          name: staged-obey-voice-bottles
          path: staged-bottles
      - name: Build or verify production bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'build' }}
        run: python3 scripts/verify-obey-voice.py --mode "$RELEASE_MODE" --staged "$GITHUB_WORKSPACE/staged-bottles" --output "$GITHUB_WORKSPACE/bottle-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obey-voice-bottle-${{ matrix.platform }}
          path: |
            bottle-evidence/bottles/*
            bottle-evidence/evidence.json
            bottle-evidence/verification.log
          if-no-files-found: error
          retention-days: 30
